<template>
    <div class="slds-card slds-theme_default slds-scrollable_y" style="height: 100%; border: none; box-shadow: none;">
        <!-- 障害発生時の表示 -->
        <template if:true={hasActiveAlert}>
            
            <!-- アラートバナー -->
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                <span class="slds-assistive-text">error</span>
                <span class="slds-icon_container slds-var-m-right_x-small">
                    <lightning-icon icon-name="utility:error" variant="inverse" size="x-small"></lightning-icon>
                </span>
                <h2 class="slds-text-heading_small">重大なシステム障害アラート</h2>
            </div>
            
            <div class="slds-var-p-around_medium">
                <!-- 障害内容 -->
                <div class="slds-var-m-bottom_medium">
                    <div class="slds-text-title_bold slds-text-color_error slds-var-m-bottom_xx-small">障害内容</div>
                    <div class="slds-text-body_regular" style="line-height: 1.5; word-wrap: break-word;">
                        {currentAlertMessage}
                    </div>
                </div>

                <!-- 【シナリオ1】メッセージングセッション画面にいる場合：自動実行のアナウンス -->
                <template if:true={isMessagingSession}>
                    <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_light" role="status" style="border-radius: 4px; border: 1px solid #c9c9c9;">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container">
                                <lightning-icon icon-name="utility:magicwand" size="small"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-text-title_bold slds-var-m-bottom_xx-small">Agentforceがお詫び文案を作成中です</p>
                            <p class="slds-text-color_weak slds-text-body_small">自動で開いた右側のチャットパネルをご確認ください。</p>
                        </div>
                    </div>
                </template>

                <!-- 【シナリオ2】それ以外の画面にいる場合：コピペ用コマンドの提示 -->
                <template if:false={isMessagingSession}>
                    <div class="slds-box slds-box_x-small slds-theme_shade">
                        <div class="slds-text-title_bold slds-var-m-bottom_x-small">
                            <lightning-icon icon-name="utility:chat" size="xx-small" class="slds-var-m-right_xx-small"></lightning-icon>
                            チャット対応時のお詫び文生成コマンド
                        </div>
                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                            <div class="slds-col slds-size_10-of-12">
                                <lightning-input type="text" variant="label-hidden" value={copyPasteCommand} readonly></lightning-input>
                            </div>
                            <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                                <lightning-button-icon icon-name={copyIconName} variant="brand" title="コピーする" alternative-text="コピー" onclick={handleCopyCommand}></lightning-button-icon>
                            </div>
                        </div>
                        <div class="slds-text-color_weak slds-text-body_small slds-var-m-top_x-small">
                            ※顧客とチャットする際、このコマンドをコピーしてEmployee Agentに入力してください。
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 平常時の表示 -->
        <template if:false={hasActiveAlert}>
            <div class="slds-var-p-around_xx-large slds-text-align_center">
                <lightning-icon icon-name="utility:success" size="large" variant="success" class="slds-var-m-bottom_medium"></lightning-icon>
                <div class="slds-text-heading_small slds-text-color_weak">
                    現在、アクティブな障害アラートはありません。
                </div>
            </div>
        </template>
    </div>
</template>
